name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: elearning_test
          POSTGRES_PASSWORD: elearning_test
          POSTGRES_DB: elearning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elearning_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://elearning_test:elearning_test@localhost:5432/elearning_test
      NODE_ENV: test
      AUTH_JWT_SECRET: test-only-secret-at-least-32-bytes-long
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:3001
      VIDEO_DRIVER: demo
      STORAGE_DRIVER: demo
      MAIL_DRIVER: demo
      PAYMENT_DRIVER: demo
      LOCAL_MAIL_DIR: .mail/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter api exec prisma generate
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - name: API e2e
        shell: bash
        run: |
          set +e
          corepack pnpm --filter api test:e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -nE "Error|FAIL|timed out|×|✗" e2e.log | grep -v '"level":"error"' | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=e2e diagnostics::$msg"
          fi
          exit $status
      - run: corepack pnpm build
      - name: Replay migrations and seed twice
        env:
          PGPASSWORD: elearning_test
          DATABASE_URL: postgresql://elearning_test:elearning_test@localhost:5432/elearning_ci
        run: |
          createdb -h localhost -U elearning_test elearning_ci
          corepack pnpm --filter api exec prisma migrate deploy
          corepack pnpm --filter api exec prisma db seed
          corepack pnpm --filter api exec prisma db seed
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM users WHERE email = 'admin@elearning.local'")" -eq 1
      # Same command as locally. Playwright builds and starts the API (3201) and
      # the web (3200, checkout on) itself, then migrates and reseeds this database.
      - name: Browser e2e (Playwright)
        env:
          PGPASSWORD: elearning_test
          E2E_DATABASE_URL: postgresql://elearning_test:elearning_test@localhost:5432/elearning_e2e
        run: |
          createdb -h localhost -U elearning_test elearning_e2e
          corepack pnpm --filter web exec playwright install --with-deps chromium
          corepack pnpm e2e:web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
