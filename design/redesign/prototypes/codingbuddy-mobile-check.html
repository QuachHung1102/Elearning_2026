<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap');

#cb-directions .cb .buddy:after{content:'';position:absolute;top:-22px;left:35px;width:15px;height:15px;background:var(--cb-lime);border:3px solid var(--cb-ink);border-radius:50%;}
#cb-directions .cb .buddy-face{background:var(--cb-paper);border:2px solid var(--cb-ink);border-radius:11px;margin:19px 10px 0;height:37px;display:flex;justify-content:space-around;align-items:center;padding:0 10px;}

 function lab(c){return '<section class="wrap lab-page"><div class="eyebrow">'+c.labEye+'</div><h1 style="font-size:40px">'+c.labTitle+'</h1><p class="section-desc">'+c.labText+'</p><div class="lab-layout"><aside class="lesson-nav">'+c.lessonNav.map(x=>'<p>'+x+'</p>').join('')+'<p class="preview-label">'+c.demo+'</p></aside><div><div class="lab-code"><div class="windowbar"><span>little_stars.py</span><span>Python</span></div><div class="code-area"><span class="code-key">for</span> row <span class="code-key">in</span> range(<span data-row-code>'+state.rows+'</span>):<br>    <span class="code-key">print</span>(<span class="code-string">"✦ "</span> * (row + 1))</div><label>'+c.rows+' <span data-row-count>'+state.rows+'</span><input data-rows type="range" min="2" max="7" value="'+state.rows+'" aria-label="'+c.rows+'"></label><div class="run-row"><small>Python / loops</small><button class="run-button cursor-interaction" type="button" data-run="stars">'+c.labRun+'</button></div><div class="output" data-stars-output aria-live="polite" style="min-height:180px;white-space:pre-wrap">'+c.labIdle+'</div></div><div class="explain">'+c.explain+'</div></div></div></section>';}
 function story(c){return '<section class="wrap section"><div class="eyebrow">'+c.aboutEye+'</div><div class="about-grid"><div class="founder-art">'+buddy+'<div class="sticker">'+c.founderSticker+'</div></div><div class="about-copy"><h1 style="font-size:40px">'+c.aboutTitle+'</h1><p>'+c.aboutText+'</p><p>'+c.aboutText2+'</p><div class="signature">'+c.aboutSign+'</div></div></div>'+mission(c)+'<div class="actions"><button type="button" class="action orange cursor-interaction" data-page="courses">'+c.cta+' ↗</button></div><p class="preview-label">'+c.demo+'</p></section>';}
 function render(){const c=copy[state.lang];worlds.forEach(w=>{const page=['courses','detail'].includes(state.page)?'courses':state.page;w.lang=state.lang;w.innerHTML='<div class="topline">'+c.strip+'</div><header class="header wrap"><button class="brand cursor-interaction" type="button" data-page="home" aria-label="CodingBuddy home">'+brand()+'</button><nav class="nav" aria-label="'+(state.lang==='vi'?'Điều hướng chính':'Main navigation')+'">'+['courses','lab','story'].map((x,i)=>'<button type="button" class="cursor-interaction" data-page="'+x+'" '+(page===x?'aria-current="page"':'')+'>'+c.nav[i]+'</button>').join('')+'</nav><div class="header-actions"><div class="lang" aria-label="Language"><button type="button" class="cursor-interaction" data-lang="vi" aria-pressed="'+(state.lang==='vi')+'">VI</button><span aria-hidden="true">/</span><button type="button" class="cursor-interaction" data-lang="en" aria-pressed="'+(state.lang==='en')+'">EN</button></div><button class="join cursor-interaction" type="button" data-page="courses">'+c.join+'</button></div></header><main>'+(state.page==='home'?home(c,w.dataset.world):state.page==='courses'?catalog(c):state.page==='detail'?detail(c):state.page==='lab'?lab(c):story(c))+'</main><footer class="footer wrap"><button type="button" class="brand cursor-interaction" data-page="home" aria-label="CodingBuddy home">'+brand()+'</button><div><p>'+c.footer+'</p><p>'+c.demo+'</p></div></footer>';const inp=w.querySelector('[data-search]');if(inp)inp.value=state.q;});}
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{language:state.lang,page:state.page,selectedProject:state.project},privateContent:{rows:state.rows}}).catch(()=>{});}
 root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.lang){state.lang=el.dataset.lang;render();save();}else if(el.dataset.page){state.page=el.dataset.page;render();save();}else if(el.dataset.project){state.project=el.dataset.project;state.page='detail';render();save();}else if(el.dataset.filter){state.filter=el.dataset.filter;render();save();}else if(el.dataset.run==='hello'){state.ran=true;worlds.forEach(w=>{const out=w.querySelector('[data-hello-output]');if(out)out.textContent=copy[state.lang].output;});}else if(el.dataset.run==='stars'){const w=el.closest('.cb');w.querySelector('[data-stars-output]').textContent=Array.from({length:state.rows},(_,i)=>'✦ '.repeat(i+1).trimEnd()).join('\n');}});
 root.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.q=e.target.value;const w=e.target.closest('.cb');const c=copy[state.lang];const filtered=projects.filter(p=>(state.filter==='All'||p.type===state.filter)&&(p.title[state.lang]+' '+p.desc[state.lang]+' '+p.type).toLocaleLowerCase().includes(state.q.toLocaleLowerCase()));w.querySelector('[data-results]').innerHTML=filtered.length?cards(c,filtered):'<p class="empty">'+c.none+'</p>';w.querySelector('.result-count').textContent=filtered.length+' '+c.results;}if(e.target.matches('[data-rows]')){state.rows=Number(e.target.value);const w=e.target.closest('.cb');w.querySelector('[data-row-code]').textContent=state.rows;w.querySelector('[data-row-count]').textContent=state.rows;w.querySelector('[data-stars-output]').textContent=copy[state.lang].labIdle;save();}});
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;const data=s?.modelContent||s;if(data?.language&&['en','vi'].includes(data.language)){state.lang=data.language;render();}});
 render();
 if(globalThis.Tweak){worlds.forEach(w=>{const look={accent:w.dataset.world==='notebook'?'#c94322':'#2d6242',showBuddy:true};const tweak=new Tweak({container:w,onChange:()=>{w.style.setProperty('--cb-orange',look.accent);w.style.setProperty('--cb-on-orange','#fffdf3');w.querySelectorAll('.buddy').forEach(b=>{b.hidden=!look.showBuddy;});}});tweak.addColorPicker(look,'accent',{label:'Brand accent',reference:'--cb-orange'});tweak.addToggle(look,'showBuddy',{label:'Buddy character'});});}
})();
</script>
