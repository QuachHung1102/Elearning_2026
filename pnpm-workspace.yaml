packages:
  - "apps/*"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
# Patched transitive ranges verified by `pnpm audit` (2026-10-28).
# Remove an entry once the parent package supplies the patched range itself.
overrides:
  multer: ">=2.5.0 <3"
  qs: ">=6.16.1 <7"
  fast-uri: ">=3.1.9 <4"
  mysql2: ">=3.23.1 <4"
  deepmerge-ts: ">=8.0.0 <9"
  proxy-addr: ">=2.0.8 <3"
  body-parser: ">=2.4.0 <3"
  source-map-js: ">=1.2.2 <2"
  sharp: ">=0.35.5 <0.36"
  'brace-expansion@1': ">=1.1.21 <2"
  'brace-expansion@5': ">=5.0.12 <6"
  vite: "8.2.4"
  'zod@4': ">=4.6.6 <5"
